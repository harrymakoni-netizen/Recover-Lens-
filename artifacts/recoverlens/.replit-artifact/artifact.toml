kind = "web"
previewPath = "/"
title = "RecoverLens"
description = "An AI-powered rehabilitation and sports movement platform with a live camera mirror, pose feedback, caregiver assistance, and clinician recovery insights."
version = "1.0.0"
id = "artifacts/recoverlens"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23853

[services.development]
run = "pnpm --filter @workspace/recoverlens run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/recoverlens", "run", "build" ]
serve = "static"
publicDir = "artifacts/recoverlens/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23853"
BASE_PATH = "/"
