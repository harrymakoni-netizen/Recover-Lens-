<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B1F3A" />
    <meta name="description" content="RecoverLens is an AI rehab mirror and adaptive recovery coach: the phone camera counts reps and checks form, a daily check-in fits the plan to how you feel, and a gentle comeback follows missed days. English, chiShona and isiNdebele. Video never leaves the device." />
    <meta property="og:title" content="RecoverLens: AI rehab mirror and recovery coach" />
    <meta property="og:description" content="Live movement coaching and an adaptive recovery plan on any phone, in three languages. Video never leaves the device." />
    <meta property="og:image" content="/brand/og-image.jpg" />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>RecoverLens · AI rehab mirror and recovery coach</title>
    <style>
      /* Shown until the app has loaded; React replaces it. */
      .rl-splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
        background: #f3f6f9; font-family: Outfit, ui-sans-serif, system-ui, sans-serif; color: #0b1f3a; }
      .rl-splash img { width: 88px; height: 88px; animation: rl-breathe 1.6s ease-in-out infinite; }
      .rl-splash b { font-size: 22px; letter-spacing: -0.01em; }
      .rl-splash b span { color: #0d7362; }
      @keyframes rl-breathe { 50% { transform: scale(1.06); opacity: 0.85; } }
      @media (prefers-reduced-motion: reduce) { .rl-splash img { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="rl-splash" role="status"><img src="/brand/mark.svg" alt="" /><b>Recover<span>Lens</span></b></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
