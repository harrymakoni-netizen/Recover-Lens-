openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: recovery
    description: Rehabilitation and movement recovery operations
  - name: sports
    description: Sports screening operations
  - name: Auth
    description: Browser and mobile authentication endpoints.
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      responses:
        "200":
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserEnvelope"
  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          schema: { type: string }
      responses:
        "302": { description: Redirect to the OIDC authorization endpoint. }
  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      responses:
        "302": { description: Redirect to the application after login. }
  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the browser session and begin OIDC logout
      parameters:
        - name: returnTo
          in: query
          required: false
          schema: { type: string, default: / }
      responses:
        "302": { description: Redirect to the OIDC provider logout URL. }
  /mobile-auth/token-exchange:
    post:
      tags: [Auth]
      operationId: exchangeMobileAuthorizationCode
      summary: Exchange a mobile OIDC code for a session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MobileTokenExchangeRequest"
      responses:
        "200":
          description: Session created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileTokenExchangeSuccess"
  /mobile-auth/logout:
    post:
      tags: [Auth]
      operationId: logoutMobileSession
      summary: Delete a mobile session token
      responses:
        "200":
          description: Logout processed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutSuccess"
  /access/invitations/redeem:
    post:
      tags: [Auth]
      operationId: redeemAccessInvitation
      summary: Redeem a one-time patient access invitation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RedeemInvitationInput"
      responses:
        "200":
          description: Access relationship created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserEnvelope"
  /patients/{patientId}/invitations:
    post:
      tags: [recovery]
      operationId: createAccessInvitation
      summary: Create a one-time patient access invitation
      parameters:
        - $ref: "#/components/parameters/PatientId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvitationInput"
      responses:
        "201":
          description: Invitation created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationResult"
  /patients:
    get:
      operationId: listPatients
      tags: [recovery]
      summary: List patients
      responses:
        "200":
          description: Patients assigned to the current clinician
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Patient"
    post:
      operationId: createPatient
      tags: [recovery]
      summary: Add a patient and assign an initial exercise
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatientInput"
      responses:
        "201":
          description: Created patient and shareable invite code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatePatientResult"
  /patients/{patientId}:
    get:
      operationId: getPatient
      tags: [recovery]
      summary: Get a patient
      parameters:
        - $ref: "#/components/parameters/PatientId"
      responses:
        "200":
          description: Patient
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Patient"
        "404":
          description: Patient not found
  /patients/{patientId}/trend:
    get:
      operationId: getPatientTrend
      tags: [recovery]
      summary: Get patient recovery trends
      parameters:
        - $ref: "#/components/parameters/PatientId"
      responses:
        "200":
          description: Trend data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientTrend"
  /sessions:
    get:
      operationId: listSessions
      tags: [recovery]
      summary: List recent sessions
      parameters:
        - name: patientId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Recent sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Session"
    post:
      operationId: createSession
      tags: [recovery]
      summary: Save a completed exercise session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionInput"
      responses:
        "201":
          description: Saved session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
  /programs:
    get:
      operationId: listPrograms
      tags: [recovery]
      summary: List exercise programs
      parameters:
        - name: patientId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Exercise programs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExerciseProgram"
    post:
      operationId: createProgram
      tags: [recovery]
      summary: Create an exercise program
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgramInput"
      responses:
        "201":
          description: Exercise program
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExerciseProgram"
  /programs/{programId}:
    patch:
      operationId: updateProgram
      tags: [recovery]
      summary: Update an exercise program
      parameters:
        - name: programId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgramInput"
      responses:
        "200":
          description: Updated exercise program
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExerciseProgram"
  /alerts:
    get:
      operationId: listAlerts
      tags: [recovery]
      summary: List unresolved recovery alerts
      responses:
        "200":
          description: Alerts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Alert"
  /alerts/{alertId}/review:
    patch:
      operationId: reviewAlert
      tags: [recovery]
      summary: Mark an alert as reviewed
      parameters:
        - name: alertId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Reviewed alert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Alert"
  /sports/screenings:
    get:
      operationId: listScreenings
      tags: [sports]
      summary: List recent squad screenings
      responses:
        "200":
          description: Sports screening results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Screening"
    post:
      operationId: createScreening
      tags: [sports]
      summary: Save a sports screening
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScreeningInput"
      responses:
        "201":
          description: Screening result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Screening"
components:
  parameters:
    PatientId:
      name: patientId
      in: path
      required: true
      schema:
        type: string
  schemas:
    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl]
      properties:
        id: { type: string }
        email: { type: ["string", "null"] }
        firstName: { type: ["string", "null"] }
        lastName: { type: ["string", "null"] }
        profileImageUrl: { type: ["string", "null"] }
        role: { type: ["string", "null"], enum: [patient, caregiver, clinician, coach, null] }
        roles:
          type: array
          items: { type: string, enum: [patient, caregiver, clinician, coach] }
        patientIds:
          type: array
          items: { type: string }
        patientAccess:
          type: array
          items:
            $ref: "#/components/schemas/PatientAccess"
    PatientAccess:
      type: object
      required: [patientId, role]
      properties:
        patientId: { type: string }
        role: { type: string, enum: [patient, caregiver, clinician, coach] }
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: "#/components/schemas/AuthUser"
            - type: "null"
    MobileTokenExchangeRequest:
      type: object
      required: [code, code_verifier, redirect_uri, state]
      properties:
        code: { type: string, minLength: 1 }
        code_verifier: { type: string, minLength: 1 }
        redirect_uri: { type: string, minLength: 1 }
        state: { type: string, minLength: 1 }
        nonce: { type: string, minLength: 1 }
    MobileTokenExchangeSuccess:
      type: object
      required: [token]
      properties:
        token: { type: string }
    LogoutSuccess:
      type: object
      required: [success]
      properties:
        success: { type: boolean, const: true }
    RedeemInvitationInput:
      type: object
      required: [code]
      properties:
        code: { type: string, minLength: 6 }
    CreateInvitationInput:
      type: object
      required: [role]
      properties:
        role: { type: string, enum: [patient, caregiver, coach] }
    InvitationResult:
      type: object
      required: [code, patientId, role, expiresAt]
      properties:
        code: { type: string }
        patientId: { type: string }
        role: { type: string, enum: [patient, caregiver, coach] }
        expiresAt: { type: string }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Patient:
      type: object
      required: [id, name, contact, condition, assignedClinician, recoveryScore, adherence, hasAlert]
      properties:
        id: { type: string }
        name: { type: string }
        initials: { type: string }
        contact: { type: string }
        condition: { type: string }
        assignedClinician: { type: string }
        sport: { type: ["string", "null"] }
        recoveryScore: { type: number }
        adherence: { type: number }
        hasAlert: { type: boolean }
        lastSession: { type: ["string", "null"] }
    PatientInput:
      type: object
      required: [name, contact, condition, initialExercise]
      properties:
        name: { type: string, minLength: 2 }
        contact: { type: string, minLength: 3 }
        condition: { type: string, minLength: 2 }
        initialExercise: { type: string, minLength: 2 }
        sport: { type: string }
    CreatePatientResult:
      type: object
      required: [patient, inviteCode]
      properties:
        patient: { $ref: "#/components/schemas/Patient" }
        inviteCode: { type: string }
    Session:
      type: object
      required: [id, patientId, exercise, timestamp, totalReps, correctReps, averageAngle, movementScore, torsoAlignment, symmetry, painScore, adherence, mode, recommendation]
      properties:
        id: { type: string }
        patientId: { type: string }
        exercise: { type: string }
        timestamp: { type: string }
        totalReps: { type: number }
        correctReps: { type: number }
        averageAngle: { type: number }
        movementScore: { type: number }
        torsoAlignment: { type: number }
        symmetry: { type: number }
        painScore: { type: number, minimum: 0, maximum: 10 }
        adherence: { type: number }
        mode: { type: string, enum: [self, caregiver-assisted] }
        recommendation: { type: string }
    SessionInput:
      type: object
      required: [patientId, exercise, totalReps, correctReps, averageAngle, movementScore, torsoAlignment, symmetry, painScore, mode, protocolMode, recommendation]
      properties:
        patientId: { type: string }
        exercise: { type: string }
        totalReps: { type: number }
        correctReps: { type: number }
        averageAngle: { type: number }
        movementScore: { type: number }
        torsoAlignment: { type: number }
        symmetry: { type: number }
        painScore: { type: number, minimum: 0, maximum: 10 }
        mode: { type: string, enum: [self, caregiver-assisted] }
        protocolMode: { type: string, enum: [patient, pilot-demo] }
        recommendation: { type: string }
    TrendPoint:
      type: object
      required: [date, movementScore, averageAngle, painScore, adherence]
      properties:
        date: { type: string }
        movementScore: { type: number }
        averageAngle: { type: number }
        painScore: { type: number }
        adherence: { type: number }
    PatientTrend:
      type: object
      required: [patientId, points, summary]
      properties:
        patientId: { type: string }
        points:
          type: array
          items: { $ref: "#/components/schemas/TrendPoint" }
        summary: { type: string }
    ExerciseProgram:
      type: object
      required: [id, patientId, exercise, targetReps, targetSets, targetAngle, frequency]
      properties:
        id: { type: string }
        patientId: { type: string }
        exercise: { type: string }
        targetReps: { type: number }
        targetSets: { type: number }
        targetAngle: { type: number }
        frequency: { type: string }
    ProgramInput:
      type: object
      required: [patientId, exercise, targetReps, targetSets, targetAngle, frequency]
      properties:
        patientId: { type: string }
        exercise: { type: string }
        targetReps: { type: number }
        targetSets: { type: number }
        targetAngle: { type: number }
        frequency: { type: string }
    Alert:
      type: object
      required: [id, patientId, type, message, createdAt, resolved]
      properties:
        id: { type: string }
        patientId: { type: string }
        type: { type: string }
        message: { type: string }
        createdAt: { type: string }
        resolved: { type: boolean }
    Screening:
      type: object
      required: [id, athlete, sport, timestamp, score, status, finding, recommendation]
      properties:
        id: { type: string }
        patientId: { type: ["string", "null"] }
        athlete: { type: string }
        sport: { type: string }
        timestamp: { type: string }
        score: { type: number }
        status: { type: string, enum: [CLEAR, REVIEW] }
        finding: { type: string }
        recommendation: { type: string }
    ScreeningInput:
      type: object
      required: [athlete, sport, score, status, finding, recommendation]
      properties:
        patientId: { type: string }
        athlete: { type: string }
        sport: { type: string }
        score: { type: number }
        status: { type: string, enum: [CLEAR, REVIEW] }
        finding: { type: string }
        recommendation: { type: string }

